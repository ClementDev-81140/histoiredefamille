# ---------------------------------------------------------------------------
#  Apache — VirtualHost du site histoiredefamille.eu
#  À placer dans /etc/apache2/sites-available/histoiredefamille.conf
#  (deploy/install.sh le fait pour vous), puis :
#      sudo a2ensite histoiredefamille
#      sudo systemctl reload apache2
#
#  Le site écoute en HTTP sur le port 80, en local uniquement : c'est le
#  tunnel Cloudflare (cloudflared) qui publie le site en HTTPS sur Internet.
#  Aucun port n'est ouvert sur la box : rien ne peut atteindre le Pi
#  directement depuis l'extérieur.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName histoiredefamille.eu
    ServerAlias www.histoiredefamille.eu

    # Seul le dossier « public » est visible depuis le web.
    # app/, deploy/, config.local.php et le stockage sont à côté, donc
    # inaccessibles par URL.
    DocumentRoot /var/www/histoiredefamille/public

    <Directory /var/www/histoiredefamille/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Le site utilise des URL « propres » : /documents/12, /arbre, etc.
        RewriteEngine On
    </Directory>

    # Le reste du projet n'est jamais servi.
    <Directory /var/www/histoiredefamille>
        Require all denied
    </Directory>
    <Directory /var/www/histoiredefamille/public>
        Require all granted
    </Directory>

    # ------------------------------------------------------------------
    # En-têtes de sécurité : ils ne sont PAS ici.
    #
    # Ils sont déclarés une seule fois, dans public/.htaccess (section
    # « En-têtes de sécurité »), qui couvre les pages PHP comme les fichiers
    # statiques. Les mettre aussi ici — comme le faisait la 1.26.0 — les
    # faisait partir deux fois, avec deux valeurs différentes.
    #
    # Ne les rajoutez pas : c'est public/.htaccess qui fait foi, et un essai
    # vérifie qu'aucun fichier de deploy/ n'en déclare.
    # ------------------------------------------------------------------
    <IfModule mod_headers.c>
        # Signature du serveur : Apache seul peut la retirer, PHP n'y touche pas.
        Header unset Server
        Header unset X-Powered-By
    </IfModule>

    # Pas de liste des fichiers si un dossier existe par erreur.
    Options -Indexes

    # ------------------------------------------------------------------
    # Blocage des fichiers sensibles, même s'ils se trouvaient dans public/.
    # ------------------------------------------------------------------
    <FilesMatch "(^\.|\.(git|env|ini|log|sql|sqlite|sqlite3|db|bak|dump|sh)$|^config.*\.php$)">
        Require all denied
    </FilesMatch>

    # ------------------------------------------------------------------
    # Envois : Cloudflare accepte environ 100 Mo par requête et coupe au
    # bout de ~100 s. On laisse Apache accepter 64 Mo (limite inchangée pour
    # l'envoi simple), mais les gros fichiers passent par MORCEAUX de 5 à
    # 20 Mo (voir « Envoyer des fichiers ») : chaque requête reste donc
    # petite. Les délais sont plus longs pour qu'un morceau de 20 Mo ait le
    # temps d'arriver sur une ligne montante lente (20 Mo à 2 Mb/s ≈ 80 s).
    # ------------------------------------------------------------------
    LimitRequestBody 67108864
    Timeout 300
    # Laisse le temps à un morceau lent d'arriver (mod_reqtimeout, activé par
    # défaut sur Debian ; sans lui, la directive est simplement ignorée).
    <IfModule reqtimeout_module>
        RequestReadTimeout header=60 body=300
    </IfModule>

    # ------------------------------------------------------------------
    # Journaux : c'est ici qu'on regarde en cas de problème (500, etc.).
    # ------------------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/histoiredefamille-error.log
    CustomLog ${APACHE_LOG_DIR}/histoiredefamille-access.log combined

    LogLevel warn

    # ------------------------------------------------------------------
    # Petite page d'attente si Apache est surchargé (le Pi a 1 Go de RAM).
    # ------------------------------------------------------------------
    ErrorDocument 503 /maintenance.html
</VirtualHost>
