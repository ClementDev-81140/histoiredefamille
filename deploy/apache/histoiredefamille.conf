# ---------------------------------------------------------------------------
#  Apache — VirtualHost du site histoiredefamille.eu
#  À placer dans /etc/apache2/sites-available/histoiredefamille.conf
#  (deploy/install.sh le fait pour vous), puis :
#      sudo a2ensite histoiredefamille
#      sudo systemctl reload apache2
#
#  Le site écoute en HTTP sur le port 80, en local uniquement : c'est le
#  tunnel Cloudflare (cloudflared) qui publie le site en HTTPS sur Internet.
#  Aucun port n'est ouvert sur la box : rien ne peut atteindre le Pi
#  directement depuis l'extérieur.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName histoiredefamille.eu
    ServerAlias www.histoiredefamille.eu

    # Seul le dossier « public » est visible depuis le web.
    # app/, deploy/, config.local.php et le stockage sont à côté, donc
    # inaccessibles par URL.
    DocumentRoot /var/www/histoiredefamille/public

    <Directory /var/www/histoiredefamille/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Le site utilise des URL « propres » : /documents/12, /arbre, etc.
        RewriteEngine On
    </Directory>

    # Le reste du projet n'est jamais servi.
    <Directory /var/www/histoiredefamille>
        Require all denied
    </Directory>
    <Directory /var/www/histoiredefamille/public>
        Require all granted
    </Directory>

    # ------------------------------------------------------------------
    # En-têtes de sécurité (le PHP les renvoie aussi).
    # ------------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        Header unset X-Powered-By
        Header unset Server
    </IfModule>

    # Pas de liste des fichiers si un dossier existe par erreur.
    Options -Indexes

    # ------------------------------------------------------------------
    # Blocage des fichiers sensibles, même s'ils se trouvaient dans public/.
    # ------------------------------------------------------------------
    <FilesMatch "(^\.|\.(git|env|ini|log|sql|sqlite|sqlite3|db|bak|dump|sh)$|^config.*\.php$)">
        Require all denied
    </FilesMatch>

    # ------------------------------------------------------------------
    # Envois : Cloudflare accepte environ 100 Mo par requête. On laisse
    # Apache accepter 64 Mo pour rester cohérent avec php.ini ; les vidéos
    # passent par le dossier « arrivée » (SFTP), pas par le navigateur.
    # ------------------------------------------------------------------
    LimitRequestBody 67108864
    Timeout 120

    # ------------------------------------------------------------------
    # Journaux : c'est ici qu'on regarde en cas de problème (500, etc.).
    # ------------------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/histoiredefamille-error.log
    CustomLog ${APACHE_LOG_DIR}/histoiredefamille-access.log combined

    LogLevel warn

    # ------------------------------------------------------------------
    # Petite page d'attente si Apache est surchargé (le Pi a 1 Go de RAM).
    # ------------------------------------------------------------------
    ErrorDocument 503 /maintenance.html
}
