; ---------------------------------------------------------------------------
;  PHP — réglages adaptés au Raspberry Pi 3B+ (1 Go de RAM)
;  Fichier : /etc/php/8.3/apache2/conf.d/99-histoiredefamille.ini
;  (deploy/install.sh le copie au bon endroit)
;
;  Après modification : sudo systemctl restart apache2
; ---------------------------------------------------------------------------

[PHP]
; Le Pi n'a qu'un gigaoctet : on limite la mémoire par requête.
memory_limit = 128M

; ---------------------------------------------------------------------------
;  Envois de fichiers
;  - les photos et PDF passent par le navigateur (limite du site : 50 Mo,
;    réglable dans config.local.php) ;
;  - Cloudflare plafonne une requête à environ 100 Mo ;
;  - les vidéos passent par le dossier « arrivée » (SFTP), jamais par PHP.
; ---------------------------------------------------------------------------
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 10
file_uploads = On

; Un envoi de 50 Mo sur une carte SD peut être lent.
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000

; ---------------------------------------------------------------------------
;  Sessions
;  Les cookies sont de toute façon configurés par le code (HttpOnly, Secure,
;  SameSite=Lax) ; ces valeurs servent de filet de sécurité.
; ---------------------------------------------------------------------------
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_maxlifetime = 86400

; ---------------------------------------------------------------------------
;  Affichage des erreurs : jamais à l'écran en production
;  (les détails d'une erreur peuvent contenir un chemin ou une donnée).
; ---------------------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
error_log = /var/log/apache2/php-histoiredefamille-error.log

; ---------------------------------------------------------------------------
;  Cache d'opcode : accélère nettement le Pi (le code PHP n'est compilé
;  qu'une fois). 48 Mo suffisent pour ce site.
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 48
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 3000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 0

; ---------------------------------------------------------------------------
;  Divers
; ---------------------------------------------------------------------------
; Fuseau horaire (le code le définit aussi).
date.timezone = Europe/Paris

; On n'utilise pas les envois par URL ni les en-têtes HTTP comme variables.
allow_url_fopen = Off
allow_url_include = Off

; Réseau : le site ne contacte aucun service externe.
default_socket_timeout = 10
